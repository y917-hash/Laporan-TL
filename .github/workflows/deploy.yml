name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main  # Ubah 'main' kalau nama branch utamamu 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Clasp
        run: sudo npm install -g @google/clasp

      - name: Create clasprc.json and .clasp.json
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          echo '{"scriptId":"${{ secrets.CLASPRC_SCRIPT_ID }}","rootDir":"./"}' > ./.clasp.json

      - name: Push Code to Apps Script
        run: clasp push --force

      - name: Deploy Apps Script
        run: clasp deploy --description "Auto deployed via GitHub Actions"
